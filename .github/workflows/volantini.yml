name: Scarica volantini
on:
  schedule:
    - cron: "15 */3 * * *"   # ogni 3 ore (lavora solo se ci sono richieste nuove)
  workflow_dispatch: {}     # anche a mano dalla scheda Actions
permissions:
  contents: write
concurrency:
  group: volantini
  cancel-in-progress: false
jobs:
  volantini:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Scarica i volantini
        run: node scripts/scarica-volantini.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Salva i risultati
        run: |
          git config user.name "volantini-bot"
          git config user.email "volantini-bot@users.noreply.github.com"
          git add volantini
          git diff --cached --quiet || (git commit -m "Volantini: aggiornamento automatico" && git push)
